<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kontakt - Kochwelt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"/>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="contact.css" />
  </head>

  <body>
    <header class="main-header">
      <a href="index.html" class="logo-link">
        <img src="img/logo.png" alt="Kochwelt Logo" class="logo-img" />
      </a>
      <nav class="navigation">
       <a href="./index.html" class="nav-link">Start</a>
      <a href="./rezept-robin.html" class="nav-link">Rezept des Tages</a>
      <a href="./contact.html" class="nav-link active">Kontakt</a>
      <a href="./Impressum.html" class="nav-link">Impressum</a>
      </nav>
    </header>

    <main class="contact-section">
      <form class="contact-form">
        <h1>Kontaktiere uns</h1>

        <label for="name">Dein Name:</label>
        <input required type="text" id="name" name="name" />

        <label for="email">Deine E-Mail:</label>
        <input required type="email" id="email" name="email" />

        <label for="message">Deine Nachricht:</label>
        <textarea required id="message" name="message"></textarea>

        <button type="submit" class="contact-button">Abschicken</button>
      </form>
    </main>

    <footer class="site-footer">
      <div class="footer-container">
        <div class="footer-brand">
          <span class="footer-logo-text">Kochwelt</span>
          <p>Dein Magazin für Rezepte und Kochtipps.</p>
        </div>

        <div class="footer-links">
           <a href="./index.html">Start</a>
      <a href="./rezept-robin.html">Rezept des Tages</a>
      <a href="./contact.html">Kontakt</a>
      <a href="./Impressum.html">Impressum</a>
        </div>

        <div class="footer-legal">
          <a href="#">AGB</a>
          <span class="separator">|</span>
          <a href="#">Datenschutz</a>
        </div>
      </div>
      <div class="footer-bottom">
        <p>&copy; 2026 Kochwelt. Alle Rechte vorbehalten.</p>
      </div>
    </footer>
  </body>
</html>
