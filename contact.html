<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kochwelt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="contact.css" />
  </head>

  <body>
    <header class="main-header">
      <img src="img/logo.png" alt="Logo" class="logo-img" />
      <nav class="navigation">
        <a href="index.html" class="nav-link">Start</a>
        <a href="rezept-robin.html" class="nav-link">Rezept des Tages</a>
        <a href="contact.html" class="nav-link active">Kontakt</a>
        <a href="#" class="nav-link">Impressum</a>
      </nav>
    </header>

    <main>
      <section class="contact-section">
        <form class="personal-info-section">
          <h1>Kontaktiere uns</h1>
          <label for="name">Dein Name:</label>
          <input required type="text" id="name" name="name" />
          <label for="email">Deine E-Mail:</label>
          <input required type="email" id="email" name="email" />
          <label for="message">Deine Nachricht:</label>
          <textarea required id="message" name="message"></textarea>
           <button class="contact-button">Abschicken</button>
        </form>
      </section>
    </main>
  </body>
</html>
