<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kochwelt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="rezept-robin.css" />

  <body>
    <header class="main-header">
      <img src="img/logo.png" alt="Logo" class="logo-img" />
      <nav class="navigation">
        <a href="#" class="nav-link">Start</a>
        <a href="#" class="nav-link">Rezept des Tages</a>
        <a href="#" class="nav-link">Kontakt</a>
        <a href="#" class="nav-link">Impressum</a>
      </nav>
    </header>
    <main>
      <section class="recipe-section container">
        <h1>Quinoa Chicken Bowl</h1>
        <img
          class="recipe-image"
          alt="Quinoa Chicken Bowl"
          src="./img/quinoa-bowl.jpg"
        />
        <div class="info-recipe">
          <p class="recipe-info-item">
            <img src="./img/icons/clock-regular.svg" alt="" />
            15 Min.
          </p>
          <p class="recipe-info-item">
            <img src="./img/icons/brain-solid.svg" alt="" />
            simpel
          </p>
          <p class="recipe-info-item">
            <img src="./img/icons/calendar-alt-regular.svg" alt="" />

          </p>
        </div>
      </section>
    </main>
